<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc">
  <title id="title">PANSPHAIRA capability contracts and provider bindings</title>
  <desc id="desc">Consumers bind to stable capability contracts. Solid paths connect released local-synthetic CRM and ERP adapters; dashed paths show a prepared alternative provider adapter. Every binding remains within explicit rights, validation, readback, receipt and recovery controls.</desc>
  <style>
    .background { fill: #f8fafc; }
    .title { fill: #172033; font: 700 30px system-ui, sans-serif; }
    .subtitle { fill: #475569; font: 18px system-ui, sans-serif; }
    .node { stroke-width: 2; rx: 16; }
    .control { fill: #ccfbf1; stroke: #0f766e; }
    .consumer { fill: #dbeafe; stroke: #2563eb; }
    .contract { fill: #ede9fe; stroke: #7c3aed; }
    .provider { fill: #fef3c7; stroke: #b45309; }
    .planned { fill: #e2e8f0; stroke: #64748b; stroke-dasharray: 10 8; }
    .label { fill: #172033; font: 700 23px system-ui, sans-serif; text-anchor: middle; }
    .small { fill: #475569; font: 17px system-ui, sans-serif; text-anchor: middle; }
    .badge { fill: #334155; font: 700 14px system-ui, sans-serif; text-anchor: middle; letter-spacing: .6px; }
    .edge { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    .edge-planned { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    .arrow { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0f172a; }
      .title, .label { fill: #f1f5f9; }
      .subtitle, .small { fill: #cbd5e1; }
      .control { fill: #123f3d; stroke: #5eead4; }
      .consumer { fill: #1e3a5f; stroke: #60a5fa; }
      .contract { fill: #372a63; stroke: #a78bfa; }
      .provider { fill: #4a3416; stroke: #fbbf24; }
      .planned { fill: #1e293b; stroke: #cbd5e1; }
      .badge { fill: #e2e8f0; }
      .edge, .edge-planned { stroke: #94a3b8; }
      .arrow { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="background" width="720" height="1040" rx="18"/>
  <text class="title" x="32" y="48">Adaptability without authority drift</text>
  <text class="subtitle" x="32" y="80">Stable contracts separate user intent from provider-specific bindings.</text>

  <!-- Connectors are behind nodes. Solid is released local-synthetic evidence; dashed is product direction. -->
  <path class="edge" d="M 360 350 V 414"/>
  <path class="edge" d="M 360 545 V 582 H 120 V 634"/>
  <path class="edge" d="M 360 545 V 634"/>
  <path class="edge-planned" d="M 360 545 V 582 H 600 V 634"/>
  <path class="edge" d="M 120 750 V 796 H 360 V 824"/>
  <path class="edge" d="M 360 750 V 824"/>
  <path class="edge-planned" d="M 600 750 V 796 H 360 V 824"/>

  <rect class="node control" x="40" y="110" width="640" height="96"/>
  <text class="label" x="360" y="148">Explicit governance for every binding</text>
  <text class="small" x="360" y="178">Rights profile · policy · approval · use-time validation</text>

  <rect class="node consumer" x="110" y="260" width="500" height="90"/>
  <text class="label" x="360" y="297">Consumers</text>
  <text class="small" x="360" y="327">Agent / UI · workflow · operator</text>

  <rect class="node contract" x="70" y="415" width="580" height="130"/>
  <text class="label" x="360" y="452">Stable capability contracts</text>
  <text class="small" x="360" y="486">customer.lookup · sales.order.create · document.store</text>
  <text class="small" x="360" y="516">Typed inputs · invariants · evidence expectations</text>

  <rect class="node provider" x="15" y="635" width="210" height="115"/>
  <text class="label" x="120" y="674">CRM read adapter</text>
  <text class="small" x="120" y="707">provider mapping</text>
  <text class="badge" x="120" y="735">RELEASED · SYNTHETIC</text>

  <rect class="node provider" x="255" y="635" width="210" height="115"/>
  <text class="label" x="360" y="674">ERP effect adapter</text>
  <text class="small" x="360" y="707">provider route</text>
  <text class="badge" x="360" y="735">RELEASED · SYNTHETIC</text>

  <rect class="node planned" x="495" y="635" width="210" height="115"/>
  <text class="label" x="600" y="674">Alternative adapter</text>
  <text class="small" x="600" y="707">template + tests</text>
  <text class="badge" x="600" y="735">PRODUCT DIRECTION</text>

  <rect class="node control" x="50" y="825" width="620" height="110"/>
  <text class="label" x="360" y="865">Explicit controls and evidence</text>
  <text class="small" x="360" y="897">Validation · authoritative readback · receipts</text>
  <text class="small" x="360" y="922">Recovery / rollback declared per binding</text>

  <path class="edge" d="M 60 992 H 124"/>
  <text class="subtitle" x="142" y="998">released local-synthetic evidence</text>
  <path class="edge-planned" d="M 405 992 H 469"/>
  <text class="subtitle" x="487" y="998">prepared product direction</text>
</svg>
