<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">SAFE_GUIDED governed effect flow</title>
  <desc id="desc">Owner asks, Agent proposes, Gateway decides, approval is obtained if required, Broker executes, and authoritative readback plus a receipt prove the result.</desc>
  <style>
    .background { fill: #f8fafc; }
    .title { fill: #172033; font: 700 24px system-ui, sans-serif; }
    .subtitle { fill: #475569; font: 16px system-ui, sans-serif; }
    .node { stroke: #64748b; stroke-width: 2; rx: 14; }
    .input { fill: #bfdbfe; }
    .neutral { fill: #e2e8f0; }
    .process { fill: #c7d2fe; }
    .approval { fill: #fde68a; }
    .proof { fill: #99f6e4; }
    .label { fill: #172033; font: 700 22px system-ui, sans-serif; text-anchor: middle; }
    .small { fill: #475569; font: 16px system-ui, sans-serif; text-anchor: middle; }
    .edge { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    .arrow { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0f172a; }
      .title, .label { fill: #f1f5f9; }
      .subtitle, .small { fill: #cbd5e1; }
      .node { stroke: #94a3b8; }
      .input { fill: #1d4ed8; }
      .neutral { fill: #334155; }
      .process { fill: #4338ca; }
      .approval { fill: #92400e; }
      .proof { fill: #115e59; }
      .edge { stroke: #94a3b8; }
      .arrow { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="background" width="720" height="560" rx="18"/>
  <text class="title" x="32" y="42">SAFE_GUIDED — governed effect path</text>
  <text class="subtitle" x="32" y="70">The Agent proposes; trusted components decide and act.</text>

  <!-- Connectors are behind nodes. -->
  <path class="edge" d="M 316 142 H 397"/>
  <path class="edge" d="M 548 188 V 237"/>
  <path class="edge" d="M 404 284 H 323"/>
  <path class="edge" d="M 172 330 V 379"/>
  <path class="edge" d="M 316 426 H 397"/>

  <rect class="node input" x="28" y="96" width="288" height="92"/>
  <text class="label" x="172" y="137">Owner asks</text>
  <text class="small" x="172" y="164">Purpose + scope</text>

  <rect class="node neutral" x="404" y="96" width="288" height="92"/>
  <text class="label" x="548" y="137">Agent proposes</text>
  <text class="small" x="548" y="164">Typed candidate only</text>

  <rect class="node process" x="404" y="238" width="288" height="92"/>
  <text class="label" x="548" y="279">Gateway decides</text>
  <text class="small" x="548" y="306">Policy + authority</text>

  <rect class="node approval" x="28" y="238" width="288" height="92"/>
  <text class="label" x="172" y="279">Approval if required</text>
  <text class="small" x="172" y="306">Exact action + diff</text>

  <rect class="node process" x="28" y="380" width="288" height="92"/>
  <text class="label" x="172" y="421">Broker executes</text>
  <text class="small" x="172" y="448">Bound effect access</text>

  <rect class="node proof" x="404" y="380" width="288" height="92"/>
  <text class="label" x="548" y="416">Readback + Receipt</text>
  <text class="small" x="548" y="445">Proves the result</text>

  <text class="subtitle" x="32" y="526">Scope: governed SAFE_GUIDED reference path — not FULL_CONTROL_LAB / RAMPAGE.</text>
</svg>
