services:
  cm-video-reference:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: "${CM_VIDEO_VCS_REF:-uncommitted}"
    image: chimpmaera/video-production-reference:2026-08-02-v2
    network_mode: "none"
    read_only: true
    user: "${CM_VIDEO_UID:-65532}:${CM_VIDEO_GID:-65532}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    volumes:
      - ./examples/minimal/job:/job:ro
      - ./examples/minimal/assets:/assets:ro
      - ./.video-output:/output:rw
    command:
      - validate
      - --job
      - /job/video-job.yaml
