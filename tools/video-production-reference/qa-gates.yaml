apiVersion: cm.video.qa-gates/v1
kind: QAGates
failClosed: true
requiredOrder:
  - source_and_checksum
  - narration_and_localization
  - claim_evidence_nonclaim_binding
  - timed_claim_visual_correlation
  - named_hash_bound_reviews
  - asset_locks
  - content_driven_editorial_duration
  - text_and_shot_preflight
  - storyboard_and_contact_sheet_preflight
  - exact_revision_human_visual_and_editorial_review
  - full_render
  - decode_and_media
  - subtitles_safe_area_asr_ocr
  - designed_ten_second_outro
  - checksum_archive
rules:
  noFullRenderBeforeTextGate: true
  noFullRenderBeforeShotGate: true
  noTtsOrFullRenderBeforeStoryboardGate: true
  noTtsOrFullRenderWhileHumanVisualReviewPendingOrRejected: true
  noTtsOrFullRenderWhileHumanEditorialReviewPendingOrRejected: true
  revisionChangeInvalidatesHumanApprovals: true
  passAutomatedNeverImpliesPublicationReadiness: true
  noSendUnlessExactRevisionFinalQaAndHumanFinalApproval: true
  appendOnlyHumanRejectionSupersessionAndRollback: true
  noAlternativeKeeper: true
  noDeprecatedCentipApeLogo: true
  noPublicOrPushAction: true
  approvedOutputsMustNotBeOverwritten: true
  naturalIdiomaticLocalizationRequired: true
  literalTranslationForbidden: true
  publicCopyFailClosed: true
  negativeFixturesRequired: true
  publicationReadyAudienceCopyRequired: true
  operationalStatusSidecarOnly: true
  finalAsrOcrAudienceCopyRequired: true
  positiveMaturityAndReleaseTruthFixturesRequired: true
  claimEvidenceAndVisualRefsRequired: true
  explicitNonClaimsRequired: true
  englishCopyReviewNamedAndHashBound: true
  semanticReviewNamedAndHashBound: true
  noFixedDailyTargetOrMaximum: true
  timingValuesAreProductionOnly: true
  noNarrationTruncationToPreset: true
  noAudioPaddingToPreset: true
  designedOutroDurationSeconds: 10
  silentOutroAcceptanceForbidden: true
  oneSemanticVisualActionPerScene: true
  progressiveEvidenceBearingVisualDevelopment: true
  narrationAndOnScreenCopyComplementary: true
  paragraphSlidesForbidden: true
  decorativeMotionForbidden: true
  brandingIsRestrainedFrame: true
  staticOrSilentTailMaximumSeconds: 1.5
  criticalTermsExactSpellingAndPronunciationInputsRequired: true
visualDesignReview:
  revisionBound: true
  required:
    - hierarchy_and_focal_point
    - alignment_grid_margins_optical_balance_safe_area
    - typography_size_weight_line_length_subtitle_collision
    - color_harmony_contrast_dark_light_color_blind_differentiation
    - icon_style_stroke_corner_radius_shadow_brand_restraint
    - motion_continuity_easing_entry_exit_transition_camera_purpose
    - mobile_readability
    - density_and_empty_space_balance
    - causal_explanation_not_decoration
    - screenshot_and_diagram_legibility_crop_position
media:
  width: 1280
  height: 720
  fps: 30
  pixelFormat: yuv420p
  audioSampleRate: 48000
  audioChannels: 1
  portableEvidenceFamilies:
    - full-decode
    - stream-parity
    - loudness
    - subtitles
    - safe-area
    - asr
    - ocr
  transition:
    type: direct-dissolve
    seconds: 0.20
